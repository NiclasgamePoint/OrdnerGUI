name: Unsigned client artifacts

on:
  workflow_call:
    inputs:
      windows-linux-only:
        type: boolean
        default: false
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/contracts/**'
      - 'packaging/client/**'
      - 'tools/*install*'
      - 'tools/collect_licenses.py'
      - 'tools/release_metadata.py'
      - 'tools/windows_version_info.py'
      - 'tools/prepare_upstream_sources.py'
      - 'tools/collect_native_inventory.py'
      - 'packaging/upstream-sources.json'
      - 'docs/native-license-review.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/client-artifacts.yml'

permissions:
  contents: read

jobs:
  upstream-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: build/upstream-sources
          key: upstream-sources-${{ hashFiles('packaging/upstream-sources.json') }}
      - name: Verify upstream sources and extract notices
        run: python tools/prepare_upstream_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-notices
          path: build/upstream-notices
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-sources
          path: build/upstream-sources
          compression-level: 0

  build:
    needs: upstream-sources
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows-linux-only && '[{"os":"ubuntu-24.04","artifact":"linux-x64"},{"os":"windows-latest","artifact":"windows-x64"}]' || '[{"os":"ubuntu-24.04","artifact":"linux-x64"},{"os":"windows-latest","artifact":"windows-x64"},{"os":"macos-15-intel","artifact":"macos-x64"},{"os":"macos-14","artifact":"macos-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install packaging environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/client/requirements-lock.txt -r packaging/client/requirements-build-lock.txt -r requirements-client-test.txt
          python -m pip install --no-deps -e packages/contracts -e packages/client
      - name: Test source packages and packaging contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_ci.py --paths tests/contracts tests/client tests/architecture tests/tools/test_check_frozen_client.py tests/tools/test_client_packaging.py tests/tools/test_start_scripts.py tests/tools/test_release_preparation.py
      - name: Verify version and license metadata
        run: python tools/release_metadata.py
      - name: Parse POSIX launchers
        if: runner.os != 'Windows'
        run: |
          for script in start.sh start.command index-tray.sh tools/docker_smoke.sh; do
            bash -n "$script"
          done
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'start.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Build unsigned client and tray
        run: |
          pyinstaller --clean --noconfirm packaging/client/pyinstaller/papagui-client.spec
          pyinstaller --clean --noconfirm packaging/client/pyinstaller/papagui-tray.spec
      - name: Inspect and launch frozen products
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_frozen_client.py dist
      - uses: actions/download-artifact@v4
        with:
          name: upstream-notices
          path: build/upstream-notices
      - name: Inventory actual native payload and OS notices
        run: python tools/collect_native_inventory.py --analysis build/papagui-client/Analysis-00.toc --analysis build/papagui-tray/Analysis-00.toc
      - name: Preserve native inventory as build evidence
        shell: bash
        run: cp -R build/native-notices dist/native-notices
      - name: Build verified update bundle
        run: python tools/build_update_bundle.py
      - name: Verify native update activation and profile backup
        run: python tools/check_client_update_bundle.py dist/updates
      - name: Locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is missing from runner image' }
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Build unsigned native installer with license inventory
        run: python tools/build_installers.py
      - name: Windows install, upgrade and uninstall smoke test
        if: runner.os == 'Windows'
        run: python tools/check_installer.py dist/installers
      - name: Linux install and launch smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/installers/*.deb
          trap 'sudo apt-get remove -y papagui-client' EXIT
          python tools/check_frozen_client.py /opt/papagui
          test -f /opt/papagui/licenses/LICENSE
          test "$(stat -c %a /opt/papagui/licenses/LICENSE)" = 644
      - name: macOS install and launch smoke test
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/installers/*.pkg -target /
          python tools/check_frozen_client.py /Applications/PapaGUI
      - uses: actions/upload-artifact@v4
        with:
          name: papagui-client-0.5.0-${{ matrix.artifact }}-unsigned
          path: dist/*
          if-no-files-found: error
