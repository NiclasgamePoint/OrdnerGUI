[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papagui-client"
dynamic = ["version"]
description = "Offline-capable PapaGUI desktop client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["papagui-contracts==0.4.2"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "python-docx>=1.1,<2",
    "olefile>=0.47,<1",
]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
papagui-client = "papagui_client.entrypoints.client:main"
papagui-tray = "papagui_client.entrypoints.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papagui_client = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "papagui_client.__version__"}
