[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papagui-server"
dynamic = ["version"]
description = "Headless PapaGUI index and customer server"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "fastapi>=0.115,<1",
    "papagui-contracts==0.5.0",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
    "phonenumbers>=9,<10",
    "email-validator>=2.2,<3",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "pdfplumber>=0.11,<1",
    "Pillow>=12.2,<13",
]

[project.scripts]
papagui-server = "papagui_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["papagui_server*"]

[tool.setuptools.package-data]
papagui_server = ["resources/*.txt", "resources/*.md"]

[tool.setuptools.dynamic]
version = {attr = "papagui_server.__version__"}
