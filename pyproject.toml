[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/contracts/src",
    "packages/server/src",
    "packages/client/src",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the pre-0.16 default rule set explicit so Ruff upgrades cannot
# unexpectedly turn newly enabled rules into CI failures.
select = ["E4", "E7", "E9", "F"]
