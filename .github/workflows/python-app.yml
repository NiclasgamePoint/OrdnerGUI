name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: |
          ruff check app tests main.py

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/run_ci.py --coverage

      - name: Write coverage XML
        if: always()
        run: python -m coverage xml -o coverage.xml

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ runner.os }}
          path: |
            coverage.xml
            .coverage
          if-no-files-found: ignore

      - name: Build check (bytecode compile)
        run: |
          python -m compileall app main.py

      - name: Count Python code lines
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          roots = [Path("app"), Path("tests"), Path("main.py")]
          total = 0
          rows = []

          def count_lines(path: Path) -> int:
            with path.open("r", encoding="utf-8", errors="ignore") as handle:
              return sum(1 for _ in handle)

          for root in roots:
            if not root.exists():
              continue
            if root.is_file() and root.suffix == ".py":
              line_count = count_lines(root)
              rows.append((str(root), line_count))
              total += line_count
              continue
            for file_path in sorted(root.rglob("*.py")):
              line_count = count_lines(file_path)
              rows.append((str(file_path), line_count))
              total += line_count

          print(f"TOTAL_PYTHON_LINES={total}")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
            summary.write("## Python code lines\n\n")
            summary.write(f"**Total:** {total}\n\n")
            summary.write("| File | Lines |\n")
            summary.write("| --- | ---: |\n")
            for file_path, line_count in rows:
              summary.write(f"| `{file_path}` | {line_count} |\n")
          PY
