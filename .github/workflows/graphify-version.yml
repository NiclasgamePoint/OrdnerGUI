name: Graphify version check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install graphifyy==0.9.53
      # An upstream tool release does not invalidate the tested application.
      # Network/install errors still fail; version drift is an explicit warning.
      - run: python tools/graphify_refresh.py --check-latest --warn-outdated
