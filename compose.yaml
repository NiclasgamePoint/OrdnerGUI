services:
  indexer:
    build:
      context: .
    image: papagui-indexer:0.4.1
    init: true
    restart: unless-stopped
    user: "${PAPAGUI_UID:-1000}:${PAPAGUI_GID:-1000}"
    environment:
      PAPAGUI_DATA_DIR: /data
      PAPAGUI_SOURCE_DIR: /source
      PAPAGUI_SETTINGS_DIR: /config
      PAPAGUI_API_TOKEN: ${PAPAGUI_API_TOKEN:-}
      QT_QPA_PLATFORM: offscreen
    volumes:
      - type: bind
        source: ${PAPAGUI_SOURCE_PATH:?PAPAGUI_SOURCE_PATH muss gesetzt sein}
        target: /source
        read_only: true
      - type: bind
        source: ${PAPAGUI_INDEX_PATH:-./docker-data}
        target: /data
      - type: bind
        source: ${PAPAGUI_CONFIG_PATH:-./docker-config}
        target: /config
    ports:
      - "${PAPAGUI_API_PORT:-8765}:8765"
    command:
      - --source
      - /source
      - --data
      - /data
      - --interval-seconds
      - ${PAPAGUI_INDEX_INTERVAL_SECONDS:-86400}
      - --api-port
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/data/index/jobs/service/index_job.json').exists() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
