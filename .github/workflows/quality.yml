name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-without-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install server test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/server/requirements-lock.txt -r requirements-test.txt
          python -m pip install --no-deps -e packages/contracts -e packages/server
      - name: Prove that Qt is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
      - name: Test contracts, server and package boundaries
        run: python -m pytest tests/contracts tests/server tests/architecture -q
      - name: Verify OpenAPI snapshot
        run: python tools/export_openapi.py --check

  client:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install client test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/client/requirements-lock.txt -r requirements-client-test.txt
          python -m pip install --no-deps -e packages/contracts -e packages/client
      - name: Test client
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/contracts tests/client tests/architecture tests/tools/test_check_frozen_client.py tests/tools/test_client_packaging.py tests/tools/test_start_scripts.py tests/tools/test_prepare_client_start.py -q
      - name: Parse POSIX launchers
        if: runner.os != 'Windows'
        run: bash -n start.sh start.command index-tray.sh tools/docker_smoke.sh
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'start.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Compile production packages
        run: python -m compileall -q packages/contracts/src packages/client/src

  wire-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install headless client/server test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/server/requirements-lock.txt -r requirements-test.txt
          python -m pip install --no-deps -e packages/contracts -e packages/server -e packages/client
      - name: Prove real HTTP interoperability
        run: python -m pytest tests/system/test_wire_interop.py -q

  repository-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install all development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/server/requirements-lock.txt -r packages/client/requirements-lock.txt -r requirements-client-test.txt
          python -m pip install --no-deps -e packages/contracts -e packages/server -e packages/client
      - name: Lint
        run: ruff check packages tests tools main.py
      - name: Test with branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_ci.py --coverage
      - name: Check Graphify source fingerprint
        run: python tools/graphify_refresh.py --check
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: .coverage
          if-no-files-found: ignore

  python-distributions:
    runs-on: ubuntu-latest
    needs: [server-without-qt, client, wire-interop, repository-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r packaging/requirements-build-lock.txt
      - name: Build three independent packages
        run: |
          python -m build --no-isolation packages/contracts
          python -m build --no-isolation packages/server
          python -m build --no-isolation packages/client
      - name: Inspect wheel boundaries
        run: python tools/check_artifacts.py dist packages/contracts/dist packages/server/dist packages/client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-python-distributions
          path: packages/*/dist/*
