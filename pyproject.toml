[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordnergui"
version = "0.4.1"
description = "PapaGUI - Kundenmanagement System"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff.lint]
# Keep the pre-0.16 default rule set explicit so Ruff upgrades cannot
# unexpectedly turn newly enabled rules into CI failures.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
app = [
    "resources/*.txt",
    "resources/*.md",
    "vendor/poppler/*.md",
    "vendor/poppler/*/bin/*",
    "vendor/poppler/*/licenses/*",
]

[tool.setuptools.packages.find]
include = ["app*"]
