name: Server image

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-multiarch-without-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: papagui-server:0.4.2-ci

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check smoke-test shell
        run: |
          bash -n tools/docker_smoke.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck tools/docker_smoke.sh
          fi
      - name: Docker smoke test
        run: bash tools/docker_smoke.sh
